__include__: [
  '../dataset/coco.yml',
  'ecdet.yml',
]

output_dir: outputs/ecdet_ml


ViTAdapter:
  name: ecvittplus
  embed_dim: 256
  num_heads: 4
  interaction_indexes: [10, 11]
  weights_path: ecvits/ecvittplus.pth

HybridEncoder:
  in_channels: [256, 256, 256]
  depth_mult: 1.0
  expansion: 1.0625
  hidden_dim: 256
  dim_feedforward: 1024
  act: silu

ECTransformer:
  activation: silu
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  num_layers: 4
  eval_idx: -1


optimizer:
  type: AdamW

  params:
    -
      # except norm/bn/bias in backbone
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -
      # including all norm/bn/bias in backbone
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      # including all norm/bn/bias except for the backbone
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 100
warmup_iter: 2000
lr_gamma: 0.1   # final LR = lr_gamma * lr; 0.5 barely anneals over 100 epochs

eval_spatial_size: [640, 640] # h w


train_dataloader:
  dataset:
    transforms:
      # Keep mosaic/mixup over ~48% of the run and leave 2 clean epochs at the
      # end, matching the ratios of the 50/74-epoch recipes. `stop_epoch` must
      # stay within 5 epochs of `epochs` or YAMLConfig.reset_cfg overrides it.
      mosaic_epoch: 48
      mosaic_prob: 0.75
      stop_epoch: 98

  collate_fn:
    mixup_prob: 0.5
    mixup_epoch: 48
