__include__: [
  '../dataset/yolo_plate_pose.yml',
  'ecpose.yml'
]

output_dir: outputs/ecpose_m_plate
# Plain `plate_nme` only averages over plates that were matched, so a model that
# finds one easy plate scores best. The penalised variant charges every missed
# ground-truth plate a full-diagonal error, which keeps recall in the selection.
primary_metric: plate_nme_penalized
primary_metric_mode: min

ViTAdapter:
  name: ecpose_vittplus
  embed_dim: 256
  weights_path: ecvits/ecpose_vittplus.pth
  interaction_indexes: [10, 11]
  num_heads: 4

HybridEncoder:
  in_channels: [256, 256, 256]
  depth_mult: 0.67
  expansion: 0.75
  hidden_dim: 256
  dim_feedforward: 512

DETRTransformer:
  hidden_dim: 256
  dim_feedforward: 512
  num_decoder_layers: 4
  num_body_points: 4

DETRPoseCriterion:
  num_classes: 1
  num_body_points: 4
  matcher:
    num_body_points: 4

DETRPosePostProcessor:
  num_body_points: 4

eval_spatial_size: [640, 640]
epoches: 92

# The inherited MultiStepLR has its only milestone at epoch 5000, i.e. the LR
# never decays. Use the flat-cosine schedule instead: flat while mosaic/mixup are
# on, cosine down to lr_gamma * lr, then constant for the stage-2 fine-tune.
lrsheduler: flatcosine
lr_gamma: 0.1
warmup_iter: 2000
flat_epoch: 45      # == policy.epoch[1], where mosaic stops
no_aug_epoch: 2     # == epoches - collate_fn.stop_epoch

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      ops:
        - {type: PoseMosaic, output_size: 320}
        - {type: MixUp, p: 0.5, default_num_keypoints: 4}
        - {type: RandomZoomOut, p: 0.5}
        - {type: RandomHorizontalFlip, flip_pairs: [[0, 1], [2, 3]]}
        - {type: ColorJitter}
        - {type: AlbumentationsImageOnly, blur_p: 0.01, median_blur_p: 0.01, to_gray_p: 0.01, clahe_p: 0.01}
        - {type: Resize, size: [640, 640]}
        - {type: ToTensor}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      mosaic_prob: 0.5
      policy:
        epoch: [4, 45, 90]
        # Must match the op class names above: this config swaps MixUpCopyPaste
        # for plain MixUp, and an unlisted op is never switched off.
        ops: ['PoseMosaic', 'MixUp', 'RandomZoomOut']
  collate_fn:
    stop_epoch: 90

val_dataloader:
  total_batch_size: 16
